<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Книжная полка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <h1>📚 Книжная полка</h1>
  <button id="addShelfBtn" class="btn btn-primary">+ Добавить полку</button>
</header>

<main id="room" class="room"></main>

<!-- ===== Модалка: добавить книгу ===== -->
<div id="addBookModal" class="modal-overlay hidden">
  <div class="modal">
    <h2>Новая книга</h2>
    <label class="field">
      <span>Название книги</span>
      <input id="bookTitleInput" type="text" maxlength="40">
    </label>
    <label class="field">
      <span>Цвет обложки</span>
      <div class="swatches" id="colorSwatches"></div>

      <div class="custom-picker">
        <div class="custom-picker-head">
          <span class="custom-picker-label">Свой оттенок</span>
          <div class="color-preview" id="colorPreview"></div>
        </div>
        <div class="range-wrap">
          <div class="range-fill hue-fill"></div>
          <input type="range" id="hueRange" min="0" max="360" value="350" aria-label="Оттенок">
        </div>
        <div class="range-wrap">
          <div class="range-fill" id="satFill"></div>
          <input type="range" id="satRange" min="0" max="100" value="45" aria-label="Насыщенность">
        </div>
        <div class="range-wrap">
          <div class="range-fill" id="lightFill"></div>
          <input type="range" id="lightRange" min="0" max="100" value="32" aria-label="Яркость">
        </div>
      </div>
    </label>
    <div class="modal-actions">
      <button id="cancelAddBook" class="btn btn-ghost">Отмена</button>
      <button id="confirmAddBook" class="btn btn-primary">Поставить на полку</button>
    </div>
  </div>
</div>

<!-- ===== Модалка: подтверждение удаления ===== -->
<div id="confirmModal" class="modal-overlay hidden">
  <div class="modal">
    <h2 id="confirmText">Удалить?</h2>
    <div class="modal-actions">
      <button id="confirmNo" class="btn btn-ghost">Отмена</button>
      <button id="confirmYes" class="btn btn-danger">Удалить</button>
    </div>
  </div>
</div>

<!-- ===== Ридер книги ===== -->
<div id="reader" class="reader hidden">
  <div class="reader-backdrop"></div>
  <div class="reader-controls">
    <button id="modeToggleBtn" class="icon-btn" title="Режим чтения" aria-label="Переключить режим чтения/письма">
      <svg class="icon-write" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
      <svg class="icon-read" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2V3z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7V3z"/></svg>
    </button>
    <button id="lockFlipBtn" class="icon-btn" title="Заблокировать перелистывание" aria-label="Заблокировать перелистывание">
      <svg class="icon-unlocked" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
      <svg class="icon-locked" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </button>
    <button id="editBookBtn" class="icon-btn" title="Изменить книгу" aria-label="Изменить книгу">✎</button>
    <button id="closeReader" class="icon-btn" title="Закрыть книгу" aria-label="Закрыть книгу">×</button>
  </div>

  <div class="book-stage">
    <div id="book" class="book">
      <div class="book-spine-side" id="bookSpineSide"></div>
      <div class="page-area" id="pageArea">
        <div class="page-static" id="pageStatic">
          <textarea class="page-editable" id="pageEditable" spellcheck="false" placeholder="Пишите здесь свою историю…"></textarea>
          <div class="printed-page-num" id="printedPageNum"></div>
        </div>
        <div id="flipLayer" class="flip-layer"></div>
        <div class="page-corner page-corner-next" id="cornerNext" title="Перелистнуть вперёд"></div>
        <div class="page-corner page-corner-prev" id="cornerPrev" title="Перелистнуть назад"></div>
      </div>
    </div>
  </div>
</div>

<!-- ===== Модалка: изменить книгу ===== -->
<div id="editBookModal" class="modal-overlay hidden">
  <div class="modal">
    <h2>Изменить книгу</h2>
    <label class="field">
      <span>Название книги</span>
      <input id="editTitleInput" type="text" maxlength="40">
    </label>
    <label class="field">
      <span>Цвет обложки</span>
      <div class="swatches" id="editColorSwatches"></div>

      <div class="custom-picker">
        <div class="custom-picker-head">
          <span class="custom-picker-label">Свой оттенок</span>
          <div class="color-preview" id="editColorPreview"></div>
        </div>
        <div class="range-wrap">
          <div class="range-fill hue-fill"></div>
          <input type="range" id="editHueRange" min="0" max="360" value="350" aria-label="Оттенок">
        </div>
        <div class="range-wrap">
          <div class="range-fill" id="editSatFill"></div>
          <input type="range" id="editSatRange" min="0" max="100" value="45" aria-label="Насыщенность">
        </div>
        <div class="range-wrap">
          <div class="range-fill" id="editLightFill"></div>
          <input type="range" id="editLightRange" min="0" max="100" value="32" aria-label="Яркость">
        </div>
      </div>
    </label>
    <div class="modal-actions">
      <button id="cancelEditBook" class="btn btn-ghost">Отмена</button>
      <button id="confirmEditBook" class="btn btn-primary">Сохранить</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
